name: Dependency audit

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Check dependencies against current advisories
        run: cargo +stable audit --deny warnings
